name: Full Test Suite (Main Branch)

# Only run on pushes to main branch (after PR merge)
on:
  push:
    branches: [ main ]

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Run ESLint
      run: npm run lint

    - name: Run all unit tests and snapshots with coverage
      run: npm test -- --run --coverage --reporter=verbose

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-main
        path: coverage/
        retention-days: 30

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-main
        path: |
          playwright-report/
          test-results/
        retention-days: 30

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const commit = context.sha;
          const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

          // You can customize this to send notifications to Slack, email, etc.
          console.log(`❌ Full test suite failed on main branch`);
          console.log(`Commit: ${commit}`);
          console.log(`Run: ${runUrl}`);
