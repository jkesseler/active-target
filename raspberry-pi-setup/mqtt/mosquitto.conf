# Active Target MQTT Server Configuration
# Eclipse Mosquitto Configuration for Active Target Time Tracking System

# =============================================================================
# General configuration
# =============================================================================

# Run as a daemon
#daemon true

# Process ID file
#pid_file /var/run/mosquitto.pid

# User to run as (when running as daemon)
#user mosquitto

# Maximum number of client connections
max_connections -1

# =============================================================================
# Default listener
# =============================================================================

# Port to use for the default listener
listener 1883 0.0.0.0

# Allow anonymous connections (no authentication)
allow_anonymous true

# Protocol version - allow both MQTT 3.1 and 3.1.1
protocol mqtt

# =============================================================================
# WebSocket listener for web clients
# =============================================================================

# WebSocket listener on port 9001
listener 9001 0.0.0.0
protocol websockets

# =============================================================================
# Logging
# =============================================================================

# Log to stdout instead of file for Docker
log_dest stdout

# Log types to enable
log_type error
log_type warning
log_type notice
log_type information

# Connection logging
connection_messages true

# Log timestamp format
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
# Persistence
# =============================================================================

# Enable persistence
persistence true

# Persistence location
persistence_location /mosquitto/data/

# Persistence file
persistence_file mosquitto.db

# Save persistence every 1800 seconds (30 minutes)
autosave_interval 1800

# =============================================================================
# Security
# =============================================================================

# Password file (optional, currently disabled for simplicity)
#password_file /mosquitto/config/passwd

# Access Control List (optional)
#acl_file /mosquitto/config/acl

# =============================================================================
# Message settings
# =============================================================================

# Maximum payload size (in bytes) - 10MB
message_size_limit 10485760

# Quality of Service settings
max_inflight_messages 20
max_queued_messages 1000

# =============================================================================
# Keep alive settings
# =============================================================================

# Keep alive timeout
keepalive_interval 60

# =============================================================================
# Topic settings
# =============================================================================

# Retain available
retain_available true

# =============================================================================
# Bridge configuration (for future expansion)
# =============================================================================

# Bridges can be configured here to connect to other MQTT brokers
# connection bridge-to-cloud
# address mqtt.cloud-provider.com:1883
# topic active-target/# out 0 "" ""
# topic active-target/# in 0 "" ""

# =============================================================================
# Plugin loading (disabled by default)
# =============================================================================

# plugin /usr/lib/mosquitto_auth.so
