# Active Target Chrony NTP Server Configuration
#
# This configuration sets up the Raspberry Pi as an NTP server for the
# Active Target time tracking system. ESP32 devices will sync time from this server.

# NTP servers to sync with when internet is available
# Use a mix of pool servers and specific reliable servers
pool 0.pool.ntp.org iburst
pool 1.pool.ntp.org iburst
pool 2.pool.ntp.org iburst
pool 3.pool.ntp.org iburst

# Fallback servers
server time.cloudflare.com iburst
server time.google.com iburst

# Record the rate at which the system clock gains/losses time
driftfile /var/lib/chrony/drift

# Allow the system clock to be stepped in the first three updates
# if its offset is larger than 1 second
makestep 1.0 3

# Enable kernel synchronization of the real-time clock (RTC)
rtcsync

# Enable hardware timestamping on all interfaces that support it
#hwtimestamp *

# Increase the minimum number of selectable sources required to adjust
# the system clock
minsources 2

# Allow NTP client access from local network
# This allows ESP32 devices to sync time from this server
allow 192.168.4.0/24
allow 172.20.0.0/16
allow 127.0.0.1

# Serve time even if not synchronized to a time source
local stratum 10

# Specify directory for log files
logdir /var/log/chrony

# Select which information is logged
log measurements statistics tracking refclocks

# Save NTP sources and their current state to a file
sourcedir /var/lib/chrony/sources.d

# Stop bad estimates upsetting machine clock
maxupdateskew 100.0

# This directive enables kernel synchronisation (every 11 minutes) of the
# real-time clock. Note that it can't be used along with the 'rtcfile' directive
rtcsync

# Step the system clock instead of slewing it if the adjustment is larger than
# one second, but only in the first three clock updates
makestep 1 3

# Enable NTP authentication (optional, for increased security)
# keyfile /etc/chrony/chrony.keys

# Set the NTP port (default is 123)
port 123

# Enable command access from localhost
cmdallow 127.0.0.1
cmdallow 172.20.0.0/16

# Bind to all interfaces
bindaddress 0.0.0.0
