; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common library dependencies shared across all environments
[common]
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3
	mulmer89/ESPRandom@^1.5.0
	tzapu/WiFiManager@^2.0.17

; ESP32-S3 DevKit C-1 (8MB Flash, No PSRAM - Current primary board)
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags =
    -D SPEED=921600
    -D RGB_BRIGHTNESS=32
    -D ESP32S3
		-DBOARD_ESP32_S3_DEVKITC1
		-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200


; ESP32-C3 DevKit M-1 (Alternative board)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = -DBOARD_ESP32_C3_DEVKITM1
monitor_speed = 115200

[platformio]
lib_dir = lib
default_envs = esp32-s3-devkitc-1